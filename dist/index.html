<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./avgh_logo.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#001A54" />
    <meta name="description" content="AVGH · Cursos, talleres y eventos. Inicia sesión y afíliate." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AVGH</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <script>
      // Detección de errores de arranque y apertura directa desde el disco.
      window.__avghBootError = null
      function avghEscapeHtml(s) {
        var d = document.createElement('div')
        d.textContent = String(s)
        return d.innerHTML
      }
      function avghShowError(titulo, detalle) {
        var root = document.getElementById('root')
        if (!root) return
        root.innerHTML =
          '<div style="max-width:560px;margin:48px auto;padding:28px;border-radius:16px;' +
          'background:#fff;box-shadow:0 10px 30px rgba(0,26,84,.12);font-family:Segoe UI,system-ui,sans-serif;color:#16213a">' +
          '<h2 style="margin:0 0 10px;color:#001a54;font-size:20px">' + avghEscapeHtml(titulo) + '</h2>' +
          '<p style="margin:0 0 16px;font-size:14px;color:#64708a">' + avghEscapeHtml(detalle) + '</p>' +
          '<button onclick="location.reload()" style="background:#d00c27;color:#fff;border:none;' +
          'padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer">Reintentar</button>' +
          '</div>'
      }
      if (window.location.protocol === 'file:') {
        avghShowError(
          'Estás abriendo la app directamente desde el disco',
          'Para ver la app usa un servidor. Ejecuta "npm run dev" (o "npm run preview") dentro de la carpeta del proyecto y entra a http://localhost:5173, o sube la carpeta dist/ a un hosting.'
        )
      }
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root')
        if (root && root.children.length === 0) {
          var code = (e && e.error && e.error.message) || (e && e.message) || 'Error desconocido'
          avghShowError('La aplicación no pudo cargar', code)
        }
      })
      window.addEventListener('unhandledrejection', function (e) {
        var root = document.getElementById('root')
        if (root && root.children.length === 0) {
          var code = (e && e.reason && (e.reason.message || e.reason)) || 'Error desconocido'
          avghShowError('La aplicación no pudo cargar', String(code))
        }
      })
    </script>
    <script type="module" crossorigin src="./assets/index-CLSLbI3b.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D7dK4kDS.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
